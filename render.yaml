services:
  - type: web
    name: scamshield-ai-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "false"
      - key: LOCAL_AUTH_SCHEMA_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_HEALTH_PER_WINDOW
        value: "30"
      - key: RATE_LIMIT_USER_PER_WINDOW
        value: "60"
      - key: RATE_LIMIT_SCAN_PER_WINDOW
        value: "10"
      - key: RATE_LIMIT_IMAGE_PER_WINDOW
        value: "4"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
